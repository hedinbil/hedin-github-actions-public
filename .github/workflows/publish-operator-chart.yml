# -----------------------------------------------------------------------------
# Publish Operator Helm Chart (Reusable Workflow)
#
# PUBLIC copy for public caller repos (e.g. azure-apim-operator), which cannot
# reference workflows in the internal hedin-github-actions repo. Keep this file
# identical to hedin-github-actions/.github/workflows/publish-operator-chart.yml.
#
# The single release contract for every operator chart:
#
#   - Chart.yaml in git is the only version source. version == appVersion, and
#     a release tag must equal <tag-prefix><version>. Nothing mutates
#     Chart.yaml in the runner and no repo variable can override the version.
#   - PRs and main pushes VALIDATE only (lint + package). Nothing is published.
#   - Publishing happens exclusively from a release tag, into
#     oci://<acr>.azurecr.io/charts-src/<chart>. Helmut ingests charts-src into
#     helm-charts, which is the only path clusters consume. The tag is
#     immutable: publishing a version that already exists hard-fails.
#
# Tag scheme: single-chart repos tag vX.Y.Z (default tag-prefix "v").
# Repos publishing several charts scope the tag per chart, e.g.
# tag-prefix "gateway-api-v" -> tag gateway-api-v1.6.1.
#
# bootstrap-to-helm-charts exists for exactly one situation: a broken Helmut
# cannot ingest its own fix from charts-src, so the fixed helmut-operator chart
# may be published straight to helm-charts. Do not use it for anything else.
#
# Caller requirements:
#   - permissions: id-token: write, contents: read
#     (plus packages: write when publish-to-ghcr is enabled)
#   - a GitHub environment "acr" whose federated credential covers the
#     caller repo with subject ...:environment:acr
#   - trigger on pull_request, push to main, and push of the release tag
# -----------------------------------------------------------------------------

name: Publish Operator Chart

on:
  workflow_call:
    inputs:
      chart-name:
        required: true
        type: string
        description: Chart name; also the repository name under charts-src/.
      chart-dir:
        required: false
        type: string
        default: ''
        description: Chart directory. Defaults to charts/<chart-name>.
      acr-name:
        required: false
        type: string
        default: hedinit
        description: Azure Container Registry name.
      azure-client-id:
        required: true
        type: string
        description: Client id of the identity with a federated credential for environment:acr.
      azure-subscription-id:
        required: true
        type: string
      azure-tenant-id:
        required: true
        type: string
      tag-prefix:
        required: false
        type: string
        default: 'v'
        description: >
          Release tags are <tag-prefix>X.Y.Z. Single-chart repos keep the
          default "v"; multi-chart repos scope it, e.g. "gateway-api-v".
      bootstrap-to-helm-charts:
        required: false
        type: boolean
        default: false
        description: >
          Escape hatch for helmut-operator only: publish to helm-charts/
          directly so a broken Helmut can ship its own fix.
      publish-to-ghcr:
        required: false
        type: boolean
        default: false
        description: Also push the chart to oci://ghcr.io/<owner>/charts as a secondary target.

jobs:
  validate:
    name: Validate chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is_release }}
      chart-dir: ${{ steps.version.outputs.chart_dir }}
    env:
      CHART_NAME: ${{ inputs.chart-name }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      # One number describes a release: Chart.yaml version, appVersion and (for
      # a release tag) the git tag must all agree. Nothing else may supply it.
      - name: Read and check chart version
        id: version
        run: |
          CHART_DIR="${{ inputs.chart-dir }}"
          if [ -z "${CHART_DIR}" ]; then
            CHART_DIR="charts/${CHART_NAME}"
          fi
          echo "chart_dir=${CHART_DIR}" >> "$GITHUB_OUTPUT"

          VERSION="$(grep '^version:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          APP_VERSION="$(grep '^appVersion:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          if [ -z "${VERSION}" ] || [ -z "${APP_VERSION}" ]; then
            echo "::error::could not read version/appVersion from ${CHART_DIR}/Chart.yaml"
            exit 1
          fi
          if [ "${VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::version ${VERSION} and appVersion ${APP_VERSION} must be equal in ${CHART_DIR}/Chart.yaml"
            exit 1
          fi

          IS_RELEASE=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${GITHUB_REF_NAME}" | grep -Eq "^$(echo "${TAG_PREFIX}" | sed 's/[.[\*^$()+?{|]/\\&/g')[0-9]+\.[0-9]+\.[0-9]+$"; then
            if [ "${TAG_PREFIX}${VERSION}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match chart version ${VERSION} (expected ${TAG_PREFIX}${VERSION}); bump Chart.yaml before tagging"
              exit 1
            fi
            IS_RELEASE=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Chart ${CHART_NAME} ${VERSION} (release build: ${IS_RELEASE})"

      - name: helm lint
        run: helm lint "${{ steps.version.outputs.chart_dir }}"

      - name: helm package
        run: helm package "${{ steps.version.outputs.chart_dir }}" --destination /tmp

  publish:
    name: Push to registry
    needs: validate
    if: needs.validate.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: acr
    env:
      CHART_NAME: ${{ inputs.chart-name }}
      ACR_NAME: ${{ inputs.acr-name }}
      VERSION: ${{ needs.validate.outputs.version }}
      CHARTS_PATH: ${{ inputs.bootstrap-to-helm-charts && 'helm-charts' || 'charts-src' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Login via Azure CLI
        uses: Azure/login@v3
        with:
          client-id: ${{ inputs.azure-client-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}

      - name: Login to ACR
        run: az acr login --name "${ACR_NAME}"

      # Published versions are immutable. Republishing an existing version
      # would silently change what clusters deploy for the same pin.
      - name: Check tag is free
        run: |
          EXISTING=$(az acr repository show-tags --name "${ACR_NAME}" \
            --repository "${CHARTS_PATH}/${CHART_NAME}" -o tsv 2>/dev/null || true)
          if echo "${EXISTING}" | grep -qx "${VERSION}"; then
            echo "::error::${CHARTS_PATH}/${CHART_NAME}:${VERSION} already published; cut a new version instead of overwriting"
            exit 1
          fi

      - name: Package and push
        run: |
          helm package "${{ needs.validate.outputs.chart-dir }}" --destination /tmp
          helm push "/tmp/${CHART_NAME}-${VERSION}.tgz" "oci://${ACR_NAME}.azurecr.io/${CHARTS_PATH}" 2>&1 | tee /tmp/push.log
          DIGEST=$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/push.log | head -1)
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Push to GHCR (secondary)
        if: inputs.publish-to-ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/${CHART_NAME}-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Summary
        run: |
          {
            echo "### ${CHART_NAME} chart"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Chart version | \`${VERSION}\` |"
            echo "| Published to | \`${CHARTS_PATH}/${CHART_NAME}:${VERSION}\` |"
            echo "| Digest | \`${DIGEST:-unknown}\` |"
            echo
            if [ "${CHARTS_PATH}" = "charts-src" ]; then
              echo "Helmut ingests this into \`helm-charts/${CHART_NAME}\`, which is the path clusters consume."
            else
              echo "Published straight to \`helm-charts\` (bootstrap escape hatch)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
